name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: dist/
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build React app
        run: pnpm run build
        env:
          VITE_API_URL: https://growonline.now/
          VITE_APP_URL: https://api.growonline.now/
          CI: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Deploy static assets with long cache
        run: |
          aws s3 sync ${BUILD_DIR}images s3://${{ vars.FRONTEND_BUCKET_NAME }}/images \
            --delete \
            --cache-control "public,max-age=31536000,immutable"
      
      - name: Deploy index.html with no cache
        run: |
          aws s3 cp ${BUILD_DIR}index.html s3://${{ vars.FRONTEND_BUCKET_NAME }}/index.html \
            --cache-control "public,max-age=0,must-revalidate"
      
      - name: Deploy other files
        run: |
          aws s3 sync ${BUILD_DIR} s3://${{ vars.FRONTEND_BUCKET_NAME }} \
            --exclude "images/*" \
            --exclude "index.html" \
            --delete \
            --cache-control "public,max-age=86400"

      - name: Invalidate CloudFront cache
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"